<button (click)="greet()" >Salida</button>

<section 
  (mouseover)="onMouseOver()" 
  style="
    background-color: cornflowerblue;  padding: 20px; margin: 50px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);  transition: all 0.3s ease;" (mouseout)="onMouseOut()">
  Pasa el mouse para que se vea:
  <span style="color: crimson; font-weight: bold; font-size: 1.2em;">{{ message }}</span>



</section>
